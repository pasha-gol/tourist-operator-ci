name: Tourist Operator CI

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5

      with:
        python-version: "3.10"

    - name: Install flake8
      run: |
        pip install flake8

    - name: Run flake8
      run: |
        flake8 .

    - name: Demonstrate GitHub Secret
      env:
        SUPER_SECRET: ${{ secrets.MY_SUPER_SECRET_KEY }}

      run: |
        echo "Trying to print secret:"
        echo "Secret value: $SUPER_SECRET"

    - name: Run unit tests
      run: |
        python -m unittest test_tour_system.py